<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" sizes="256x256" href="../img/logo-icon.png">
  <link rel="apple-touch-icon" href="../img/logo-icon.png">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <title>Nueva contraseña | Fuera de Lugar Sport</title>
</head>
<body data-page="admin-reset" class="auth-page">
  <main class="auth-card">
    <a class="brand brand--center auth-brand" href="../index.html" aria-label="Fuera de Lugar Sport, volver a la tienda">
      <img class="brand__logo" src="../img/logo-horizontal.png" alt="Fuera de Lugar Sport" width="1254" height="1254">
    </a>
    <div><span class="eyebrow">Administración</span><h1>Crea una nueva contraseña</h1></div>
    <form id="reset-form" class="stack-form">
      <label>Nueva contraseña<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <label>Repite la contraseña<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></label>
      <button class="btn btn--primary btn--block" type="submit">Guardar contraseña</button>
    </form>
  </main>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
