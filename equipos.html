<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Explora los clubes y selecciones disponibles en Fuera de Lugar Sport.">
  <link rel="icon" type="image/png" sizes="256x256" href="img/logo-icon.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>Equipos | Fuera de Lugar Sport</title>
</head>
<body data-page="teams">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div id="site-header"></div>
  <main id="main" class="container page teams-page">
    <nav class="breadcrumbs" aria-label="Migas de pan">
      <a href="index.html">Inicio</a><span aria-hidden="true">›</span><span aria-current="page">Equipos</span>
    </nav>

    <header class="teams-header">
      <span class="eyebrow">Elige tus colores</span>
      <h1>Equipos</h1>
      <p>Encuentra todas las prendas de tu club o selección.</p>
    </header>

    <section class="team-explorer" aria-label="Explorar equipos">
      <div class="team-explorer__search-row">
        <div class="team-search">
          <label class="sr-only" for="team-search-input">Buscar dentro de equipos</label>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
          <input id="team-search-input" type="search" inputmode="search" autocomplete="off" placeholder="Buscar dentro de equipos...">
          <button id="clear-team-search" class="team-search__clear" type="button" aria-label="Limpiar búsqueda" hidden>×</button>
        </div>
        <label class="team-sort" for="team-sort-select">
          <span>Ordenar</span>
          <select id="team-sort-select" aria-label="Ordenar equipos">
            <option value="asc">A–Z</option>
            <option value="desc">Z–A</option>
          </select>
        </label>
      </div>

      <div class="team-filter-scroller">
        <div class="tabs team-filters" id="team-tabs" aria-label="Filtrar equipos por tipo"></div>
      </div>
    </section>

    <div class="team-results-head">
      <p id="team-result-count" aria-live="polite">Cargando equipos…</p>
      <button id="clear-team-filters" class="team-clear-all" type="button" hidden>Limpiar filtros</button>
    </div>

    <div id="all-teams" class="team-directory is-loading" aria-busy="true">
      <div class="team-card-skeleton" aria-hidden="true"><span></span><i></i><i></i></div>
      <div class="team-card-skeleton" aria-hidden="true"><span></span><i></i><i></i></div>
      <div class="team-card-skeleton" aria-hidden="true"><span></span><i></i><i></i></div>
      <div class="team-card-skeleton" aria-hidden="true"><span></span><i></i><i></i></div>
      <div class="team-card-skeleton" aria-hidden="true"><span></span><i></i><i></i></div>
      <div class="team-card-skeleton" aria-hidden="true"><span></span><i></i><i></i></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="mobile-nav"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
