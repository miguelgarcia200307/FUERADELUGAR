<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="icon" type="image/png" sizes="256x256" href="img/logo-icon.png"><link rel="stylesheet" href="assets/css/styles.css"><title>Finalizar pedido | Fuera de Lugar Sport</title></head><body data-page="checkout"><a class="skip-link" href="#main">Saltar al contenido</a><div id="site-header"></div><main id="main" class="container page checkout-page"><header class="page-header"><span class="eyebrow">Último paso</span><h1>Finaliza tu pedido</h1><p>Revisaremos disponibilidad y coordinaremos el pago contigo por WhatsApp.</p></header><form id="checkout-form" class="checkout-layout"><section class="form-card"><h2>Tus datos</h2><div class="form-grid"><label>Nombre completo<input name="fullName" required autocomplete="name" maxlength="100"></label><label>Teléfono<input name="phone" required autocomplete="tel" inputmode="tel" maxlength="25"></label><label>Ciudad<input name="city" required autocomplete="address-level2" maxlength="80"></label><label>Método de entrega<select name="delivery" id="delivery-method" required><option value="">Selecciona una opción</option><option>Recoger en tienda</option><option>Domicilio</option><option>Envío nacional</option></select></label><label id="address-field" class="form-grid__full" hidden>Dirección<input name="address" autocomplete="street-address" maxlength="180"></label><fieldset class="form-grid__full"><legend>Método de pago</legend><div id="payment-methods" class="radio-list"></div></fieldset><label class="form-grid__full">Observaciones<textarea name="notes" rows="3" maxlength="500" placeholder="Indicaciones opcionales"></textarea></label></div></section><aside><div id="checkout-summary" class="summary-card"></div><button class="btn btn--primary btn--block" type="submit">Enviar pedido por WhatsApp</button><p class="secure-note">No pagarás dentro de
