<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Tus productos favoritos en Fuera de Lugar Sport">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" sizes="256x256" href="img/logo-icon.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>Favoritos | Fuera de Lugar Sport</title>
</head>
<body data-page="favorites">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div id="site-header"></div>
  <main id="main" class="container page favorites-page">
    <nav class="breadcrumbs" aria-label="Migas de pan"><a href="index.html">Inicio</a><span>›</span><span>Favoritos</span></nav>
    <header class="favorites-header">
      <div><h1>Mis favoritos</h1><p id="favorite-count" aria-live="polite">Cargando tus productos…</p></div>
      <label class="favorites-sort"><span>Ordenar</span><select id="favorite-sort-select"><option value="recent">Recientes</option><option value="price-asc">Precio menor</option><option value="price-desc">Precio mayor</option><option value="name">A-Z</option><option value="discount">Mayor descuento</option></select></label>
    </header>
    <div id="favorite-products" class="product-grid skeleton-grid" aria-live="polite" aria-busy="true"></div>
  </main>
  <div id="site-footer"></div>
  <div id="mobile-nav"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
