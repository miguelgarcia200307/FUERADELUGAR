<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" sizes="256x256" href="../img/logo-icon.png">
  <link rel="apple-touch-icon" href="../img/logo-icon.png">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <title>Ingresar | Fuera de Lugar Sport</title>
</head>
<body data-page="admin-login" class="auth-page">
  <main class="auth-card">
    <a class="brand brand--center auth-brand" href="../index.html" aria-label="Fuera de Lugar Sport, volver a la tienda">
      <img class="brand__logo" src="../img/logo-horizontal.png" alt="Fuera de Lugar Sport" width="1254" height="1254">
    </a>
    <div><span class="eyebrow">Administración</span><h1>Bienvenido</h1><p>Ingresa con la cuenta autorizada de la tienda.</p></div>
    <form id="login-form" class="stack-form">
      <label>Correo electrónico<input type="email" name="email" required autocomplete="email"></label>
      <label>Contraseña<input type="password" name="password" required autocomplete="current-password" minlength="6"></label>
      <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
    </form>
    <button id="forgot-password" class="link-button" type="button">Olvidé mi contraseña</button>
    <a href="../index.html">← Volver a la tienda</a>
  </main>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
